name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check catalog freshness
        run: bun catalog:check

      - name: Lint
        run: bun check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Knip
        run: bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Applying migrations against an ephemeral database is a sanity check that
      # they are well formed; the unit suite itself uses no real database
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vortex
        run: bunx drizzle-kit migrate --config src/lib/config/drizzle.config.ts

      # The suite is hermetic: a preloaded setup file (src/__tests__/setup.ts)
      # provides deterministic config and tests inject their own fakes, so the
      # whole suite runs in a single process rather than the per-directory
      # invocations the old mock.module approach required
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vortex
          AUTH_BASE_URL: http://localhost:8000
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          HATCHET_CLIENT_TOKEN: test-token
          ENCRYPTION_KEY: dy0jCcMkkhD1MLuKLdroeL1EClV0v7RaaqudbwyMjbY=
        run: bun test
